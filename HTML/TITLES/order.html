<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order list</title>
  </head>
  <body>
    <h1>Ordered list</h1>
    <ol>
      <li>Element 1</li>
      <li>Element 2</li>
      <li>Element 3</li>
    </ol>

    <h1>Unordered list</h1>
    <ul>
      <li>Element 1</li>
      <li>Element 2</li>
      <li>Element 3</li>
    </ul>
  </body>
</html>
