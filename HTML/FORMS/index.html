<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <form method="POST" action="backend/form.php" enctype="multipart/form-data">
      <select name="country" id="country" title="country">
        <option value="">Select an option</option>
        <option value="Australia">Australia</option>
        <option value="Deutchland">Deutchland</option>
        <option value="Italy">Italy</option>
        <option value="France">France</option>
      </select>
      <br />
      <input type="radio" name="food" id="rice" value="rice" /><label for="rice"
        >Rice</label
      >
      <input type="radio" name="food" id="chicken" value="chicken" /><label
        for="chicken"
        >Chicken</label
      >
      <br />
      <label for="terms">Accept terms and conditions</label>
      <input type="checkbox" name="agreements" id="terms" value="yes" />
      <br />
      <label for="load">Percent</label>
      <input type="range" name="load" id="load" />
      <br />
      <br />
      <textarea
        name="comments"
        id="comments"
        cols="30"
        rows="10"
        minlength="10"
        maxlength="500"
        placeholder="Enter a message"
        required
      ></textarea>
      <br />
      <input type="submit" value="Send" />
    </form>
  </body>
</html>
