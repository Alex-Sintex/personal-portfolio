<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 32 - SweetAlert</title>
  </head>
  <body>
    <h4>Greetings from SweetAlert</h4>
    <input type="button" value="Click Me" onclick="salute()" />
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script>
      function salute() {
        swal("Hello, welcome to SweetAlert!");
      }
    </script>
  </body>
