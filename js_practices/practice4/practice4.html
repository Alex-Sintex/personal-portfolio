<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 4 - Concatenation</title>
</head>
<body>
    <script>
        let name = "Alice";
        let lastName = "Smith";
        let price = 1.99;

        document.write(name + ' ' + lastName);
        document.write('<br>');
        document.write(`${name} ${lastName}`);
        document.write('<br>');
        document.write('Name: ' + name + ' ' + lastName);
        document.write('<br>');
        document.write('El precio es: ' + price + ' USD');
        document.write('<br>');
        document.write('==========================<br>');
        document.write(name, ' ', lastName);
        document.write('<br>');
        document.write('El precio es: ', price, ' USD');
    </script>
</body>
</html>
