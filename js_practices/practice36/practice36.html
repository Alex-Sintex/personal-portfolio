<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 36 - Onfocus</title>
  </head>
  <body>
    <h4>Enter your data</h4>
    <form>
      <label for="name"
        >Name:
        <input
          type="text"
          name="name"
          id="name"
          onfocus="empty(this)"
          value="Enter your name"
        /><br /><br />
      </label>
      <label for="age"
        >Age:
        <input
          type="text"
          name="age"
          id="age"
          onfocus="empty(this)"
          value="Enter your age"
        /><br /><br />
      </label>
      <input type="button" value="Submit" onclick="verify()" />
    </form>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script>
      function empty(control) {
        control.value = "";
      }

      function verify() {
        swal("Data confirmed");
      }
    </script>
  </body>
</html>
