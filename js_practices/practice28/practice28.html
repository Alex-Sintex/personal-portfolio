<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 28 - POO, Class Date</title>
  </head>
  <body>
    <script>
      // Create a Date object for the current date and time
      const ActualDate = new Date();
      document.write("Today is: " + ActualDate);
      document.write("<br>");

      // Create a new Date object
      let date = new Date();
      document.write("Today is: " + date.getDate());
      document.write("<br>");

      // Months are zero-indexed in JavaScript, so we add 1 to get the correct month
      document.write("Month is: " + (date.getMonth() + 1));
      document.write("<br>");
      document.write("Year is: " + date.getFullYear());
      document.write("<br>");
      document.write(
        "Hours is: " + date.getHours(),
        ":",
        date.getMinutes(),
        ":",
        date.getSeconds()
      );
    </script>
  </body>
</html>
