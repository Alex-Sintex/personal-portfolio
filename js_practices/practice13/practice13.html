<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 13 - String functions</title>
  </head>
  <body>
    <script>
      let word = "JavaScript";
      document.write(`The word is: ${word}<br>`);

      // Display the length of the word
      document.write(`Length of the word: <b>${word.length}</b><br>`);

      // Display special characters
      document.write("First 4 characters: <b>" + word.slice(0, 4) + "</b><br>");

      document.write(
        "First 4 characters: <b>" + word.substring(0, 4) + "</b><br>"
      );

      // Change values of a text
      let salute = "Hello World";
      salute = salute.replace("World", "JavaScript");
      document.write(salute);
      document.write("<br>");

      // Convert to uppercase
      document.write(word.toUpperCase());
      document.write("<br>");

      // Convert to lowercase
      document.write(word.toLowerCase());
      document.write("<br>");

      // Join strings
      let str1 = "Hello";
      let str2 = "World";
      document.write("Join words: ", str1.concat(" ", str2));
      document.write("<br>");

      // Trim whitespace
      let word3 = "   Hello   ";
      document.write(word3);
      document.write("<br>");
      // Trim start
      document.write(word3.trimStart());
      document.write("<br>");
      // Trim end
      document.write(word3.trimEnd());
      document.write("<br>");
      // Trim both ends
      document.write(word3.trim());
      document.write("<br>");

      // Split string
      document.write(word.split("Java"));
    </script>
  </body>
</html>
