<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON, LECTURA DE ARCHIVOS FORMA 1 (video 57)</title>
  </head>
  <body>
    <div id="name"></div>
    <script>
      // declare a variable
      let Jsondata;
      // create a new xhr object
      let xhr = new XMLHttpRequest();
      // open(method, url, async)
      xhr.open("GET", "practice52.json", true);
      // set request header = "json"
      xhr.responseType = "json";
      // onload is called once the request is completed
      xhr.onload = function () {
        // if the request is successful
        if (xhr.status === 200) {
          // get the json data
          Jsondata = xhr.response;
          // get the text element
          let textElement = document.getElementById("name");
          // display the name
          const h1 = document.createElement("h1");
          h1.textContent = Jsondata.name;
          textElement.appendChild(h1);
        } else {
          // if the request is not successful display the error
          console.log("Error: " + xhr.status);
        }
      };
      // send the request
      xhr.send();
    </script>
  </body>
</html>
