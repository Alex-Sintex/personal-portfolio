<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON [CATCH] (video 60)</title>
  </head>
  <body>
    <div id="name"></div>
    <script>
      // declare a variable
      let jsonData;
      // fetch the file
      fetch("practice55.json")
        // convert the response to json
        .then((response) => response.json())
        // display the data
        .then((data) => {
          // get data
          jsonData = data;
          // display the data
          const textElement = document.getElementById("name");
          textElement.textContent = jsonData.address.street;
        })
        // display the error
        .catch(function (error) {
          alert("Error: " + error);
        });
    </script>
  </body>
</html>
