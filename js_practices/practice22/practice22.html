<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 22 - Break Continue</title>
  </head>
  <body>
    <script>
      for (let i = 0; i < 10; i++) {
        document.write(i);
        document.write("<br>");
        if (i === 3) {
          document.write("Here is number: ", i);
          document.write("<br>");
          document.write("<br>");
          break;
        }
      }

      let word = "JavaScript";
      let result = "";

      for (let x in word) {
        // Skip the letter 'a'
        if (word[x] === "a" || word[x] === "i") {
          // Skip this iteration
          continue;
        } else {
          // Append other letters to result
          result += word[x];
        }
      }
      document.write("Result without a: ", result);
    </script>
  </body>
</html>
