<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 26 - POO (Oriented Programming Object)</title>
  </head>
  <body>
    <h1>Creation car object</h1>
    <script>
      // Object Literal
      let Auto = {
        // Properties
        brand: "Toyota",
        model: "Corolla",
        year: 2020,
        color: "Blue",
        type: "Sedan",
        radio: ["FM", "AM", "Bluetooth", "AUX"],
      };
      document.write("Brand: " + Auto.brand + "<br>");
      document.write("Model: " + Auto.model + "<br>");
      document.write("Year: " + Auto.year + "<br>");
      document.write("Color: " + Auto.color + "<br>");
      document.write("Type: " + Auto.type + "<br>");
      document.write("Radio: " + Auto.radio.join(", ") + "<br>");
    </script>
  </body>
</html>
