<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERVIDORES [ AXIOS ] (video 78)</title>
  </head>
  <body>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <button type="button" onclick="getInfo()">Get</button>
    <ul id="infoList"></ul>
    <script>
      /**
       * Makes a GET request to the specified URL and populates a list with the
       * response data
       * @function getInfo
       */
      function getInfo() {
        axios
          .get("https://jsonplaceholder.typicode.com/posts")
          .then(function (response) {
            let infoList = document.getElementById("infoList");
            response.data.forEach(function (info) {
              let li = document.createElement("li");
              li.textContent = info.title;
              infoList.appendChild(li);
            });
          })
          .catch(function (error) {
            console.log(error);
          });
      }
    </script>
  </body>
</html>
