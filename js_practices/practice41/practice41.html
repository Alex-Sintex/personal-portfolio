<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 41 - Text Area, Character Counting</title>
  </head>
  <body>
    <p>
      <textarea
        name="text"
        id="text"
        rows="10"
        cols="35"
        maxlength="140"
        placeholder="Enter some text..."
      ></textarea>
    </p>
    <p>Available characters: <span id="cant">20</span></p>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script>
      let textArea = document.getElementById("text");
      textArea.style.resize = "none";

      textArea.addEventListener("input", characters);

      function characters() {
        let cant = textArea.value.length;
        let available = 20 - cant;
        document.getElementById("cant").innerHTML = available;

        if (available <= 0) {
          swal("You have reached the character limit");
          // Trim extra characters if user tries to go beyond
          textArea.value = textArea.value.substring(0, 20);
        }
      }
    </script>
  </body>
</html>
