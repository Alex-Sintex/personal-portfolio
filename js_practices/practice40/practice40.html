<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 40 - SCREEN AND BROWSER PROPERTIES (Video 45)</title>
  </head>
  <body>
    <h4>Screen properties</h4>
    <script>
      // height is the total height of the screen
      document.write("availHeight: " + screen.availHeight + "<br>");
      // availWidth is the width of the browser window
      document.write("availWidth: " + screen.availWidth + "<br>");
      // ColorDepth is the number of bits used to display one color
      document.write("ColorDepth: " + screen.colorDepth);

      document.write("<h4>Browser properties</h4>");
      document.write("appName: ", navigator.appName + "<br>");
      document.write("appVersion: ", navigator.appVersion + "<br>");
      document.write("cookieEnabled: ", navigator.cookieEnabled + "<br>");
      document.write("plugins: ", navigator.plugins.length + "<br>");
      
    </script>
  </body>
</html>
