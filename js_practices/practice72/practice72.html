<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERVIDORES [FETCH AVANZADO ] (video 77)</title>
  </head>
  <body>
    <script>
      // Fetch API is a modern replacement for XMLHttpRequest
      // HTTP requests with credentials
      // Cache use
      // Handle redirections
      let user = "admin";
      let password = "123456";
      let token = "myToken";

      fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "GET",
        credentials: "include",
        cache: "only-if-cached",
        redirect: "manual",
        headers: {
          //Authorization: "Bearer token" + btoa(user + ":" + password),
          Authorization: "Bearer" + token,
          "Content-Type": "application/json",
        },
      })
        .then((response) => {
          if (response.type === "opaque") {
            // Redirect to a new location
            let newLocation = response.headers.get("Location");
            console.log("Redirected to: ", newLocation);
          } else {
            return response.json();
          }
        })
        .then((data) => console.log(data))
        .catch((error) => console.error(error));
    </script>
  </body>
</html>
