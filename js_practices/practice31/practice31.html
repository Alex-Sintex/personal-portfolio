<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 31 - Forms, Control Select Index</title>
  </head>
  <body>
    <h4>Stoplight colors</h4>
    <form>
      <p>
        <select id="select1" onchange="changeColor()" title="Stoplight colors">
          <option value="Go ahead">Green</option>
          <option value="Get ready">Yellow</option>
          <option value="Stop">Red</option>
        </select>
      </p>
      <p>
        Selected index:
        <input placeholder="text1" type="text" name="text1" id="text1" size="1" />
      </p>
      <p>
        Selected color:
        <input placeholder="text2" type="text" name="text2" id="text2" size="5" />
      </p>
      <p>
        Indication:
        <input placeholder="text3" type="text" name="text3" id="text3" size="5" />
      </p>
    </form>
    <script>
      function changeColor() {
        const selection = document.getElementById("select1");
        const selectedOption = selection.options[selection.selectedIndex];
        document.getElementById("text1").value = selection.selectedIndex;
        document.getElementById("text2").value = selectedOption.text;
        document.getElementById("text3").value = selectedOption.value;
      }
    </script>
  </body>
</html>
