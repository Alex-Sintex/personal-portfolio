<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 38 - Open(), Confirm()</title>
  </head>
  <body>
    <h5>Open functions and confirm</h5>
    <form>
      <label>
        Open in a new tab
        <input type="button" value="Open" onclick="openTab()" />
      </label>
      <br /><br />
      <label>
        Open in a new window
        <input type="button" value="Open" onclick="openWin()" />
      </label>
      <br /><br />
      <input type="button" value="Exit" onclick="conf()" />
    </form>

    <script>
      function openTab() {
        let w = window.open("", "_blank"); // open new tab
        w.document.write("<h1>I am another website</h1>");
      }

      function openWin() {
        let w = window.open("", "", "width=400,height=250"); // open new window
        w.document.write("<h1>I am another window</h1>");
      }

      function conf() {
        let choice = confirm("Do you want to exit?");
        if (choice == true) {
          window.close();
        }
      }
    </script>
  </body>
</html>
