<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 18 - While loop</title>
  </head>
  <body>
    <script>
      // Practice 18 - While loop
      let i = 1; // Initialize counter variable to 1
      while (i <= 10) {
        document.write("Number: " + i + "<br>");
        i++;
      }
      document.write("Loop ended." + "<br><br>");

      let j = 10; // Initialize counter variable to 10
      while (j >= 1) {
        document.write("Countdown: " + j + "<br>");
        j--;
      }
      document.write("Countdown finished.", "<br><br>");

      let x = 1; // Initialize counter variable to 1
      let sum = 0; // Initialize sum variable to 0
      let value; // Declare variable to hold user input

      // Loop 2 times to get user input and calculate sum
      while (x <= 2) {
        // Prompt user to enter a number (Int)
        value = parseInt(prompt("Enter number"));
        sum += value; // Add user input to sum
        x++; // Increment counter variable
      }
      document.write("The total sum is: " + sum);
    </script>
  </body>
</html>
