  <body>
    <script>
      class Sportsman {
        constructor(name, lastName) {
          this.name = name;
          this.lastName = lastName;
        }
      }

      class Footballer extends Sportsman {
        constructor(name, lastName, goals) {
          super(name, lastName);
          this.goals = goals;
        }
      }
    </script>
