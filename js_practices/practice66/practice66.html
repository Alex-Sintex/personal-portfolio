      /**
       * Return a promise that resolves with an array of users when the request is successful
       * @returns {Promise<Array<Object>>} A promise that resolves with an array of users
       */
      function getUsers() {
        return new Promise(function (resolve, reject) {
          let xhr = new XMLHttpRequest(); // Create an XHR object
          xhr.open("GET", "https://jsonplaceholder.typicode.com/users"); // Open the request
          xhr.onload = function () {
            // Check if the request was successful
            if (xhr.status === 200) {
              // Parse the JSON response
              resolve(JSON.parse(xhr.responseText));
            } else {
              // Reject the promise with the error message
              reject(xhr.statusText);
            }
          };
          // Send the request
          xhr.send();
        });
      }

      // Call the promise function
      getUsers()
        // Handle the resolved promise
        .then(function (users) {
          console.log(users);
        })
        // Handle the rejected promise
        .catch(function (error) {
          console.log(error);
        });
    </script>
