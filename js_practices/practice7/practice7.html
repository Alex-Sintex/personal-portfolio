  <body>
    <script>
      // Practice 7: Using Constants in JavaScript
      const price = 200;
      document.write("Precio: ", price);
      document.write("<br>");
      // Attempting to change the value of a constant will result in an error
      price = 300;
      document.write("Nuevo precio: ", price);

    </script>
