<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVENTOS EN TIEMPO REAL (video 66)</title>
  </head>
  <body>
    <form id="MessageContainer">
      <input type="text" id="message" placeholder="Enter message..." />
      <button type="button" id="btn_send">Send</button>
    </form>
    <div id="chatMsg"></div>
    <script>
      // Create a WebSocket
      let socket = new WebSocket("ws://localhost:8080");
      // Get elements
      let message = document.getElementById("message");
      let btn_send = document.getElementById("btn_send");

      // Functions
      function showMessage(content) { // Show message in chat
        let container_msg = document.getElementById("chatMsg"); // Get div container
        let MessageElement = document.createElement("p"); // Create paragraph
        MessageElement.innerText = content; // Add content to paragraph
        container_msg.appendChild(MessageElement); // Add paragraph to container
      }

      btn_send.onclick = function () { // Send message when button is clicked
        let msg = message.value; // Get message value
        showMessage(msg); // Show message
        socket.send(msg); // Send message
      };

      socket.onmessage = function (event) { // Receive message
        let message = event.data; // Get message value
        showMessage(message); // Show message in chat container
      };
    </script>
  </body>
</html>
