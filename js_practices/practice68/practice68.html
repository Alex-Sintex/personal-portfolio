<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROGRAMACION ASINCRONA [MANEJO DE ERRORES] (video 73)</title>
  </head>
  <body>
    <script>
      /**
       * Function to add two numbers asynchronously
       * @param {number} a - First number
       * @param {number} b - Second number
       * @param {function} callback - Function to handle the result
       * @returns {undefined}
       */
      /*
      Example 1
      function sum(a, b, callback) {
        setTimeout(function () {
          if (typeof a != "number" || typeof b != "number") {
            return callback(new Error("Los argumentos deben ser números"));
          }
          callback(null, a + b);
        }, 1000);
      }

      // Call the sum function
      sum("a", 50, function (error, result) {
        if (error) {
          console.log(error);
        } else {
          console.log(result);
        }
      });
      */

      // Example 2 - Promises
      /*
      function sum(a, b) {
        return new Promise(function (resolve, reject) {
          setTimeout(function () {
            if (typeof a != "number" || typeof b != "number") {
              reject(new Error("Both arguments must be numbers"));
            } else {
              resolve(a + b);
            }
          }, 1000);
        });
      }

      sum(30, "t")
        .then(function (result) {
          console.log(result);
        })
        .catch(function (error) {
          console.log(error);
        });
        */

      // Example 3 - Async/Await
      async function sum(a, b) {
        if (typeof a != "number" || typeof b != "number") {
          throw new Error("Some arguments are not numbers");
        } else {
          return a + b;
        }
      }

      /**
       * Handles errors from the sum function
       * @throws {Error} If an error occurs
       */
      async function handleErrors() {
        try {
          let result = await sum("e", 24);
          console.log(result);
        } catch (error) {
          console.log(error.message);
        }
      }

      handleErrors();
    </script>
  </body>
</html>
