<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 17 - Switch Case</title>
  </head>
  <body>
    <script>
      // Declare a variable to hold the user input
      let value;
      // Prompt the user to enter a number between 1 and 3
      value = parseInt(prompt("Enter a number between 1 and 3"));

      // Use a switch statement to display corresponding messages
      switch (value) {
        case 1:
          alert("You entered One");
          break;
        case 2:
          alert("You entered Two");
          break;
        case 3:
          alert("You entered Three");
          break;
        default:
          alert("Invalid input! Please enter a number between 1 and 3.");
      }
    </script>
  </body>
</html>
