<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 15 - Logical operators</title>
  </head>
  <body>
    <form id="userForm">
      <div class="container">
        <h3>Form</h3>
        <input
          type="text"
          name="continent"
          id="continent"
          placeholder="Enter your continent"
        />
        <input type="number" name="age" id="age" placeholder="Enter your age" />
        <input type="submit" value="Submit" />
      </div>
    </form>
    <script>
      // Logical operators practice
      document
        .getElementById("userForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent form from submitting and refreshing the page

          const continent = document.getElementById("continent").value;
          const age = parseInt(document.getElementById("age").value);

          // Validate input
          if (continent === "" || isNaN(age)) {
            alert("Please fill in both continent and age fields.");
            return;
          }

          // Check access conditions
          if (continent === "America" || continent === "Europe" && age >= 18) {
            alert("Welcome to " + continent + "!");
          } else {
            alert("Access denied!");
          }

          // Clear form fields
          document.getElementById("continent").value = "";
          document.getElementById("age").value = "";
        });
    </script>
    <style>
      .container {
        max-width: 100%;
        margin: 5px auto;
        padding: 2px 10px 10px 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
      }

      h3 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
        font-size: 24px;
      }

      input {
        box-sizing: border-box;
        display: block;
        margin-bottom: 10px;
        font-weight: 400;
        font-size: 16px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 3px;
        padding: 5px 0px;
        padding-right: 10px;
        padding-left: 10px;
      }

      input[type="submit"] {
        background-color: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
      }

      input[type="submit"]:hover {
        background-color: #45a049;
      }
    </style>
  </body>
</html>
