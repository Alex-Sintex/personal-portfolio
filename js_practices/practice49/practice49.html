<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HERENCIA - METODOS(Get y Set), (video 54)</title>
  </head>
  <body>
    <script>
      class Sportsman {
        constructor(name, lastName) {
          this.name = name;
          this.lastName = lastName;
        }
      }

      class Footballer extends Sportsman {
        constructor(name, lastName, goals) {
          super(name, lastName);
          this._goals = goals;
        }
        get goals() {
          return this._goals;
        }

        set goals(newGoals) {
          this._goals = newGoals;
        }
      }
    </script>
  </body>
</html>
