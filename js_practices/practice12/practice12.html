<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 12 - Cadenas de texto</title>
</head>
<body>
    <script>
        let texto1 = 'JavaScript';
        let texto2 = "JavaSCript";
        let texto3 = "Eso es 'la verdad' de todo";

        // Usando etiquetas HTML <br>
        let texto4 = 'Esto es una cadena muy larga' + '<br>' +
        'que necesita que dividamos en varias lineas' + '<br>' +
        'de lo contrario, el código no será legible';

        // Usando el carácter de escape \
        let texto5 = 'Esto es una cadena muy larga \
        que necesita que dividamos en varias lineas \
        de lo contrario, el código no será legible';

        document.write(texto1);
        document.write('<br>');
        document.write(texto2);
        document.write('<br>');
        document.write(texto3);
        document.write('<br>');
        document.write(texto4);
        document.write('<br>');
        document.write('<br>');
        document.write(texto5);
    </script>
</body>
</html>
