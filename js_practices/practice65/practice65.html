<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROGRAMACIÓN ASINCRONA (CALLBACKS) (VIDEO 70)</title>
  </head>
  <body>
    <script>
      function nextQueue(callback) {
        setTimeout(function () {
          console.log("Your turn has arrived!");
          callback();
        }, 5000);
      }

      function call() {
        console.log("Go ahead to ur turn");
      }
      console.log("Arrive to the queue");

      nextQueue(call);
      console.log("You go to buy coffee");
    </script>
  </body>
</html>
