<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 6 - Input data</title>
  </head>
  <body>
    <script>
      let name, age, address, phone, email;
      name = prompt("Introduce tu nombre...");
      age = prompt("Introduce tu edad...");
      address = prompt("Introduce tu dirección...");
      phone = prompt("Introduce tu teléfono...");
      email = prompt("Introduce tu email...");
      document.write("Nombre: " + name);
      document.write("<br>");
      document.write("Edad: " + age);
      document.write("<br>");
      document.write("Dirección: " + address);
      document.write("<br>");
      document.write("Teléfono: " + phone);
      document.write("<br>");
      document.write("Email: " + email);
    </script>
  </body>
</html>
