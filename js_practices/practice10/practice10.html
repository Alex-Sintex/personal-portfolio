<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 10 - Comparison operators</title>
  </head>
  <body>
    <script>
      // Comparison operators practice
      let value1, value2;
      value1 = 20;
      value2 = 10;

      // Greater than
      document.write(value1 > value2);
      document.write("<br>");
      // Less than
      document.write(value1 < value2);
      document.write("<br>");
      // Equal to
      document.write(value1 === value2);
      document.write("<br>");
      // Not equal to
      document.write(value1 !== value2);
      document.write("<br>");
      // Less than or equal to
      document.write(value1 <= value2);
      document.write("<br>");
      // Greater than or equal to
      document.write(value1 >= value2);
    </script>
  </body>
</html>
