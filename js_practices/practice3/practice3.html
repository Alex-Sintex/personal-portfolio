<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 3 - Variables</title>
  </head>
  <body>
    <script>
      // Valores de tipo cadena
      let name = "José";
      // Valores enteros
      let cant = 42;
      // Valores decimales
      let price = 10.55;
      // Valores booleanos
      let esVerdadero = false;
      // Valores nulos
      let esNulo = null;
      // Objetos
      let persona = {
        nombre: "Ana",
        edad: 30,
      };

      document.write(name);
      document.write("<br>");
      document.write(cant);
      document.write("<br>");
      document.write(price);
      document.write("<br>");
      document.write(esVerdadero);
      document.write("<br>");
      document.write(esNulo);
      document.write("<br>");
      document.write(persona.nombre);
    </script>
  </body>
</html>
