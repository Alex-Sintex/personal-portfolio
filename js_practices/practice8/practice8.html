<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 8 - Mathematical Operators</title>
  </head>
  <body>
    <script>
      let a, b, sum, res, mult, div, resid, pot;

      // Ask data to user
      a = parseInt(prompt("Ingrese valor 1..."));
      b = parseInt(prompt("ingrese valor 2..."));

      // Addition
      sum = a + b;
      // Substraction
      res = a - b;
      // Multiplication
      mult = a * b;
      // Divison
      div = a / b;
      // Remainder
      resid = a % b;
      // Power
      pot = a ** b;

      document.write("<h2>Resultados de las operaciones</h2>");
      document.write("<p>Suma: " + sum + "</p>");
      document.write("<p>Resta: " + res + "</p>");
      document.write("<p>Multiplicación: " + mult + "</p>");
      document.write("<p>División: " + div + "</p>");
      document.write("<p>Residuo: " + resid + "</p>");
      document.write("<p>Potencia: " + pot + "</p>");
    </script>
  </body>
</html>
