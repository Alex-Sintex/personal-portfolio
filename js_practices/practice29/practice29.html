<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 29 - Form</title>
  </head>
  <body>
    <h4>Increment button</h4>
    <br />
    <form>
      <input type="button" value="Click to Increment" onclick="increment()" />
    </form>
    <script>
      let counter = 0;
      function increment() {
        counter++;
        alert("Value: " + counter);
      }
    </script>
  </body>
</html>
