<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 39 - WINDOW.LOCATION, REDIRECT</title>
  </head>
  <body>
    <h1>Go to Wikipedia.com</h1>
    <input type="button" value="Go" onclick="redirect()" />
    <script>
      function redirect() {
        if (window.confirm("Do you want to exit page?")) {
          window.location = "https://www.wikipedia.com";
        }
      }
    </script>
  </body>
</html>
