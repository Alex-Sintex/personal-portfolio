<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 27 - POO, Classes and Objects Creation</title>
  </head>
  <body>
    <script>
      // Class
      class Person {
        // Properties
        name = "Homero";
        lastName = "Simpson";
        address = "742 Evergreen Terrace";
        phone = "555-1234";
        email = "ZDyYV@example.com";

        // Method
        work() {
          return "Working in nuclear plant";
        }

        study() {
          return "Springfield University";
        }
      }

      // Object Creation
      const homero = new Person();
      const bart = new Person();
      const lenny = new Person();

      document.write("Name: " + homero.name + "<br>");
      document.write("Last Name: " + homero.lastName + "<br>");
      document.write("Activity: " + homero.work() + "<br>");
      document.write("<br>");

      document.write("Name: " + "Bart " + bart.lastName + "<br>");
      document.write("Study: " + bart.study() + "<br>");

      document.write("<br>");
      document.write("Lenny studies in " + lenny.study());
    </script>
  </body>
</html>
