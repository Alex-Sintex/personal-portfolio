<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 30 - Forms, Control Text</title>
  </head>
  <body>
    <h4>User access</h4>
    <form>
      <h3>Enter user:</h3>
      <br />
      <input
        type="text"
        name="user"
        id="user"
        placeholder="Username"
      /><br /><br />
      <h3>Enter password:</h3>
      <br />
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
      />
      <br /><br />
      <input type="button" value="Submit" onclick="verify()" />
    </form>
    <script>
      let control = 0;
      let password = "access01";

      function verify() {
        let passwd = document.getElementById("password").value;
        if (passwd != password || passwd == "") {
            alert("Incorrect password or empty. Try again.");
            control++;
            if (control >= 3) {
                alert("You have exceeded the number of attempts. Access denied.");
            }
        } else {
            window.open("https://www.google.com");
        }
      }
    </script>
  </body>
</html>
