<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVENTOS [MOUSEOVER, MOUSEOUT, MOUSEMOVE] (video 65)</title>
  </head>
  <body>
    <button type="button" id="mybtn">Open menu</button>
    <ul id="mymenu" style="display: none">
      <li>Option 1</li>
      <li>Option 2</li>
      <li>Option 3</li>
    </ul>
    <script>
      let menu = document.getElementById("mymenu");
      let btn = document.getElementById("mybtn");

      btn.addEventListener("click", function () {
        menu.style.display = "block";
      });

      // mouseout event is triggered when the mouse leaves the element
      btn.addEventListener("mouseout", function () {
        menu.style.display = "none";
      });

      document.addEventListener("mousemove", function (event) {
        console.log("Position X: " + event.clientX + " - Position Y: " + event.clientY);
      });
    </script>
  </body>
</html>
