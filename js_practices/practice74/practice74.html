    <meta charset="UTF-8" />

  </head>
  <body>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
      // GET request with axios
      /*
      axios
        .get("https://jsonplaceholder.typicode.com/posts")

        .catch((error) => console.log(error));
      */

      // POST request with axios
      /*
      let data = {
        title: "New post",
        body: "New description",
      };

        .post("https://jsonplaceholder.typicode.com/posts", data)

        )
        .catch((error) => console.log(error));
      */
      let myToken = "This_is_my_token";

      axios.interceptors.request.use(
        (config) => {
          config.headers.Authorization = `Bearer ${myToken}`;
          return config;
        },
        (error) => Promise.reject(error)
      );

      axios.interceptors.response.use(
        (response) => {
          response.data.customField = "This is a custom field";
          return response;
        },
        (error) => Promise.reject(error)
      );

      let order1 = axios.get("https://jsonplaceholder.typicode.com/posts/1");
      let order2 = axios.get("https://jsonplaceholder.typicode.com/posts/2");
      let order3 = axios.get("https://jsonplaceholder.typicode.com/posts/3");

      axios
        .all([order1, order2, order3])
        .then(
          axios.spread((order1, order2, order3) => {
            console.log(order1.data);
            console.log(order2.data);
            console.log(order3.data);
          })
        )
        .catch((error) => console.log("Error publishing" + error));
    </script>
  </body>
