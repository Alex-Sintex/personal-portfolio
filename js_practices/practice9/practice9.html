<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 9 - Asignation operators (Increment and decrement)</title>
  </head>
  <body>
    <script>
      let a = 1;

      document.write("Valor de a: ", a);
      document.write("<br>");
      // Increment value of a by 1
      a++;
      document.write("Valor de a: ", a);
      document.write("<br>");
      // Increment variable
      a += 5;
      document.write("Valor de a: ", a);
      document.write("<br>");
      // Decrement value of a by 1
      a--;
      document.write("Valor de a: ", a);
      document.write("<br>");
      // Decrement variable
      a -= 3;
      document.write("Valor de a: ", a);
      document.write("<br>");
      a *= 2;
      document.write("Valor de a: ", a);
      document.write("<br>");
      // a/a
      a /= 3;
      document.write("Valor de a: ", a);
      document.write("<br>");
      a **= 3;
      document.write("Valor de a: ", a);
    </script>
  </body>
</html>
