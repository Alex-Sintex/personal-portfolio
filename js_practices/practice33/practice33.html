<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 33 - Checkbox</title>
  </head>
  <body>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <h4>What languages do u know?</h4>
    <form>
      <input
        type="checkbox"
        name="chk1"
        id="chk1"
        placeholder="Java"
      />Java<br />
      <input
        type="checkbox"
        name="chk2"
        id="chk2"
        placeholder="Python"
      />Python<br />
      <input type="checkbox" name="chk3" id="chk3" placeholder="C++" />C++<br />
      <input
        type="checkbox"
        name="chk4"
        id="chk4"
        placeholder="JavaScript"
      />JavaScript<br />
      <input type="checkbox" name="chk5" id="chk5" placeholder="C#" />C#<br />
      <input type="button" value="Submit" onclick="selection()" />
    </form>
    <script>
      function selection() {
        let cant = 0;
        if (document.getElementById("chk1").checked) {
          cant++;
        }
        if (document.getElementById("chk2").checked) {
          cant++;
        }
        if (document.getElementById("chk3").checked) {
          cant++;
        }
        if (document.getElementById("chk4").checked) {
          cant++;
        }
        if (document.getElementById("chk5").checked) {
          cant++;
        }
        if (cant === 0) {
          swal("You don't know any language");
        } else if (cant === 1) {
          swal("You know 1 language");
        } else {
          swal("You know " + cant + " languages");
        }
      }
    </script>
  </body>
</html>
