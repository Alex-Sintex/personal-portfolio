<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 20 - FOR loop</title>
  </head>
  <body>
    <script>
      // Practice 20: Using FOR loop to print numbers
      for (let i = 1; i <= 10; i++) {
        if (i === 5) {
          document.write("Number: five");
          document.write("<br>");
        } else {
          document.write("Number: " + i);
          document.write("<br>");
        }
      }
      document.write("Finished loop!");
      document.write("<br><br>");

      const fruits = ["Apple", "Banana", "Cherry", "Grape", "Elderberry"];

      for (let f = 0; f < fruits.length; f++) {
        document.write("Fruit: ", f, " = ", fruits[f]);
        document.write("<br>");
      }
    </script>
  </body>
</html>
