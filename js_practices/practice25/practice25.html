<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 25 - Functions with return values</title>
  </head>
  <body>
    <script>
      let result;
      function sum(a, b) {
        result = a + b;
        return result;
      }
      document.write(sum(30, 60));
      document.write("<br>");

      function salute() {
        return "Hello World!";
      }
      let message = salute();
      document.write(message);

      function displayColor(value) {
        value = parseInt(prompt("Enter a number (1-3):"));
        switch (value) {
          case 1:
            return "Red";
          case 2:
            return "Green";
          case 3:
            return "Yellow";
          default:
            return "Invalid number";
        }
      }

      alert(displayColor());
    </script>
  </body>
</html>
